import java.text.SimpleDateFormat

plugins {
    id 'java-library'
    id 'org.openjfx.javafxplugin' version '0.1.0' apply false
}

version = '0.3.6a'

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'org.openjfx.javafxplugin'

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    repositories {
        mavenCentral()
    }

    javafx {
        version = "21.0.3"
        modules = ['javafx.controls', 'javafx.graphics', 'javafx.base']
    }

    dependencies {
        implementation 'com.googlecode.json-simple:json-simple:1.1.1'
    }

    // Ensure resources (CSS, FXML, PNG) are properly included for every subproject
    sourceSets {
        main {
            resources {
                srcDirs = ['src/main/resources', 'src/main/java']
            }
        }
    }

    tasks.named('processResources', Copy).configure {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
}

Date buildTimeAndDate = new Date()
ext {
    buildDate = new SimpleDateFormat('yyyy-MM-dd').format(buildTimeAndDate)
    buildTime = new SimpleDateFormat('HH:mm:ss.SSSZ').format(buildTimeAndDate)
}

// Combines outputs (classes + 40+ CSS files) from all subprojects into one single Enzo JAR
tasks.register('oneJar', Jar) {
    archiveBaseName = 'Enzo'
    archiveVersion = project.version

    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    subprojects.each { subproject ->
        from subproject.sourceSets.main.output
    }

    manifest {
        attributes(
            'Built-By': System.properties['user.name'],
            'Created-By': "${System.properties['java.version']} (${System.properties['java.vendor']} ${System.properties['java.vm.version']})",
            'Build-Date': project.buildDate,
            'Build-Time': project.buildTime,
            'Specification-Title': project.name,
            'Specification-Version': project.version,
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Bundle-Name': project.name,
            'Bundle-License': 'https://www.apache.org/licenses/LICENSE-2.0',
            'Bundle-Description': 'Enzo widgets',
            'Bundle-SymbolicName': 'eu.hansolo.enzo',
            'Automatic-Module-Name': 'eu.hansolo.enzo'
        )
    }
}