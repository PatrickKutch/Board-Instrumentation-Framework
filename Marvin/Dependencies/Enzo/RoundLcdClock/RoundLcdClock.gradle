// FlipPanel
plugins {
    id 'java-library'
    id 'application'
    id 'org.openjfx.javafxplugin'
}

repositories {
    mavenCentral()
}

javafx {
    version = "21.0.3"
    modules = [ 'javafx.controls' ]
}

application {
    mainClass = 'eu.hansolo.enzo.roundlcdclock.Demo'
}

sourceSets {
    main {
        resources {
            srcDirs = ['src/main/resources', 'src/main/java']
        }
    }
}

dependencies {
    implementation project(':Common'), project(':Fonts')
}
