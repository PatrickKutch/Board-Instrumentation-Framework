/*
 * Modern Gradle build file for Marvin JavaFX (Java 21, Gradle 8/9)
 */
import java.text.SimpleDateFormat
import java.util.Properties

plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'java'
    id 'idea'
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

javafx {
    version = "21.0.3"
    modules = ['javafx.controls', 'javafx.web', 'javafx.media', 'javafx.swing', 'javafx.graphics', 'javafx.base']
}

dependencies {
    implementation files('Dependencies/Enzo-0.3.6a.jar')
}

application {
    mainClass = 'kutch.biff.marvin.Launcher'
}

// -----------------------------------------------------------------------------
// Version Properties Initial Setup & Update Task
// -----------------------------------------------------------------------------
def versionPropsFile = file('src/main/resources/kutch/biff/marvin/version/Marvin.version.properties')
def initialProps = new Properties()

if (versionPropsFile.exists()) {
    versionPropsFile.withInputStream { stream -> initialProps.load(stream) }
}

// Initialize project.ext defaults so Manifest properties are ALWAYS defined
project.ext.set('buildVersion', initialProps['Build_Version'] ?: '0')
project.ext.set('releaseType', initialProps['Release'] ?: 'Unknown')
project.ext.set('versionDate', initialProps['Date'] ?: 'Unknown')
project.ext.set('buildDate', new SimpleDateFormat('yyyy-MM-dd').format(new Date()))
project.ext.set('buildTime', new SimpleDateFormat('HH:mm:ss.SSSZ').format(new Date()))

tasks.register('updateVersionProperties') {
    doLast {
        if (project.hasProperty('updateReleaseInfo')) {
            if (versionPropsFile.exists()) {
                def versionProps = new Properties()
                versionPropsFile.withInputStream { stream -> versionProps.load(stream) }

                // Increment the build version
                def buildVersion = (versionProps['Build_Version'] ?: '0').toInteger() + 1
                versionProps['Build_Version'] = buildVersion.toString()

                // Date & Time formatting
                Date currentDate = new Date()
                def buildDate = new SimpleDateFormat('yyyy-MM-dd').format(currentDate)
                def buildTime = new SimpleDateFormat('HH:mm:ss.SSSZ').format(currentDate)
                versionProps['Date'] = new SimpleDateFormat('yyyy/MM/dd HH:mm').format(currentDate)
                versionProps['Year_Version'] = new SimpleDateFormat('yy').format(currentDate)
                versionProps['Month_Version'] = new SimpleDateFormat('MM').format(currentDate)
                versionProps['Day_Version'] = new SimpleDateFormat('dd').format(currentDate)

                // Debug flag
                def isDebugBuild = project.hasProperty('debugBuild')
                versionProps['DEBUG'] = isDebugBuild ? 'true' : 'false'

                // Save back to resources
                versionPropsFile.withOutputStream { stream ->
                    versionProps.store(stream, "Updated automatically by Gradle build")
                }

                // Update project extension properties with new values
                project.ext.set('buildVersion', versionProps['Build_Version'])
                project.ext.set('releaseType', versionProps['Release'] ?: 'Development')
                project.ext.set('versionDate', versionProps['Date'])
                project.ext.set('buildDate', buildDate)
                project.ext.set('buildTime', buildTime)

                println ">> Updated version properties: Build Version=${buildVersion}, Date=${versionProps['Date']}"
            } else {
                throw new GradleException("Version properties file not found: ${versionPropsFile}")
            }
        } else {
            println ">> Skipping version properties update ('updateReleaseInfo' flag not passed)."
        }
    }
}

tasks.named('processResources').configure {
    dependsOn tasks.named('updateVersionProperties')
}

// -----------------------------------------------------------------------------
// Fat JAR Packaging Task
// -----------------------------------------------------------------------------
jar {
    dependsOn tasks.named('updateVersionProperties')

    archiveBaseName = 'BIFF.Marvin'
    archiveFileName = 'BIFF.Marvin.jar'

    doFirst {
        manifest {
            attributes([
                'Main-Class'           : application.mainClass.get(),
                'Built-By'             : System.properties['user.name'],
                'Created-By'           : "${System.properties['java.version']} (${System.properties['java.vendor']} ${System.properties['java.vm.version']})",
                'Build-Date'           : "${project.ext.buildDate}",
                'Build-Time'           : "${project.ext.buildTime}",
                'Specification-Title'  : project.name,
                'Specification-Version': "${project.ext.buildVersion}",
                'Implementation-Title' : project.name,
                'Implementation-Version': "${project.ext.buildVersion}",
                'Bundle-Name'          : project.name,
                'Bundle-License'       : 'https://www.apache.org/licenses/LICENSE-2.0',
                'Bundle-Description'   : 'BIFF Marvin',
                'Bundle-SymbolicName'  : 'kutch.biff.marvin.Marvin',
                'Automatic-Module-Name': 'kutch.biff.marvin.Marvin',
                'Release-Type'         : "${project.ext.releaseType}",
                'Version-Date'         : "${project.ext.versionDate}"
            ])
        }
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    with copySpec {
        from sourceSets.main.output
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.debug = project.hasProperty('debugBuild')
}

// -----------------------------------------------------------------------------
// Enzo Library Tasks
// -----------------------------------------------------------------------------
tasks.register('buildEnzo', GradleBuild) { task ->
    println "-------- Building ENZO Library ---------"
    task.dir = file("Dependencies/Enzo")
    task.tasks = ['oneJar']
}

tasks.register('copyEnzoJar', Copy) {
    println "-------- Copying ENZO Library ---------"
    from 'Dependencies/Enzo/build/libs'
    include 'Enzo*.jar'
    into 'Dependencies'
    rename { 'Enzo-0.3.6a.jar' }
}

tasks.named('copyEnzoJar').configure {
    mustRunAfter tasks.named('buildEnzo')
}

tasks.register('buildDeps') {
    dependsOn tasks.named('buildEnzo'), tasks.named('copyEnzoJar')
}

// Automatically build Enzo dependency if missing
tasks.named('compileJava').configure {
    if (!file('Dependencies/Enzo-0.3.6a.jar').exists()) {
        dependsOn tasks.named('buildDeps')
    }
}

// Clean tasks
tasks.register('cleanEnzo', GradleBuild) { task ->
    println "-------- Cleaning ENZO Library ---------"
    task.dir = file("Dependencies/Enzo")
    task.tasks = ['clean']
}

tasks.named('clean').configure {
    dependsOn tasks.named('cleanEnzo')
    delete file('Dependencies/Enzo-0.3.6a.jar')
}

// -----------------------------------------------------------------------------
// Native Windows Executable (.exe) Task
// -----------------------------------------------------------------------------
tasks.register('buildExe', Exec) {
    dependsOn tasks.named('jar')

    group = 'distribution'
    description = 'Generates a standalone Windows application with Marvin.exe'

    def outputDir = layout.buildDirectory.dir("dist").get().asFile
    def inputJarDir = layout.buildDirectory.dir("libs").get().asFile
    def iconFile = file('src/main/resources/kutch/biff/marvin/images/Marvin.ico')

    doFirst {
        delete outputDir
    }

    def javaHome = System.getProperty('java.home')
    def jpackageExec = new File(javaHome, 'bin/jpackage.exe').exists() ? 
                       new File(javaHome, 'bin/jpackage.exe').absolutePath : 'jpackage'

    def jpackageArgs = [
        jpackageExec,
        '--type', 'app-image',
        '--dest', outputDir.absolutePath,
        '--name', 'Marvin',
        '--vendor', 'Patrick Kutch',                           // Sets the Publisher name
        '--copyright', 'Copyright © 2026 Patrick Kutch',      // Sets Copyright
        '--description', 'Board Instrumentation Framework',   // Sets File Description
        '--app-version', "${project.ext.buildVersion}.0",     // Sets Version
        '--input', inputJarDir.absolutePath,
        '--main-jar', 'BIFF.Marvin.jar',
        '--main-class', application.mainClass.get(),
        '--win-console'
    ]

    if (iconFile.exists()) {
        jpackageArgs.addAll(['--icon', iconFile.absolutePath])
    }

    commandLine jpackageArgs
}